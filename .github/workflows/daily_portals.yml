name: Warsaw OLX and Otodom catalogue

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Initial catalogue, daily discovery, or broad price refresh
        type: choice
        required: true
        default: daily
        options:
          - daily
          - bootstrap
          - refresh
      save_db:
        description: Save catalogue, price observations and traversal progress
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '15 6 * * *'
      timezone: Europe/Warsaw

permissions:
  contents: read

jobs:
  test:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.PORTAL_COLLECTION_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portal_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal_test -d portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://portal_test:local_test_only@localhost:5432/portal_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  collect:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.PORTAL_COLLECTION_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: daily-portal-collection
      cancel-in-progress: false
    env:
      SAVE_TO_DB: ${{ github.event_name == 'schedule' || inputs.save_db }}
      DATABASE_URL: ${{ (github.event_name == 'schedule' || inputs.save_db) && secrets.DATABASE_URL || '' }}
      CATALOG_MODE: ${{ inputs.mode || 'daily' }}
      CATALOG_MAX_PAGES: ${{ vars.CATALOG_MAX_PAGES || '1000' }}
      CATALOG_MAX_LISTINGS: ${{ vars.CATALOG_MAX_LISTINGS || '50000' }}
      CATALOG_MAX_REQUESTS: ${{ vars.CATALOG_MAX_REQUESTS || '700' }}
      REQUEST_DELAY_SECONDS: ${{ vars.REQUEST_DELAY_SECONDS || '2' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Validate database configuration when requested
        run: |
          python - <<'PY'
          import os
          if os.environ['SAVE_TO_DB'] == 'true' and not os.environ.get('DATABASE_URL'):
              raise SystemExit('Add the DATABASE_URL repository secret before enabling database writes.')
          PY
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect Warsaw catalogue and update observations
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          mode = os.environ['CATALOG_MODE']
          if os.environ['GITHUB_EVENT_NAME'] == 'schedule':
              mode = 'refresh' if datetime.now(ZoneInfo('Europe/Warsaw')).weekday() == 6 else 'daily'
          command = [sys.executable, '-m', 'src.catalog_pipeline', '--mode', mode]
          if os.environ['SAVE_TO_DB'] == 'true':
              command.append('--save-db')
          raise SystemExit(subprocess.call(command))
          PY
      - name: Summarize collection audit
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = Path('data/catalog_audit.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Warsaw apartment-sale catalogue\n\n')
              summary.write('New means first observed by this database. Catalogue traversal and publication dates do not prove market completeness, sale status or model quality.\n\n')
              if not report.exists():
                  summary.write('No audit file was produced; inspect the failed step.\n')
              else:
                  audit = json.loads(report.read_text(encoding='utf-8'))
                  sources = audit.get('sources', {})
                  entries = sources.items() if isinstance(sources, dict) else enumerate(sources) if isinstance(sources, list) else []
                  for source, entry in entries:
                      if not isinstance(entry, dict):
                          continue
                      label = str(entry.get('source', source))
                      if label not in {'olx', 'otodom', 'www.olx.pl', 'www.otodom.pl'}:
                          label = 'Unknown source'
                      summary.write('### ' + label + '\n\n')
                      source_audit = entry.get('audit', {})
                      if not isinstance(source_audit, dict):
                          source_audit = {}
                      status = entry.get('status')
                      if status in {'success', 'partial', 'failed', 'ok', 'completed', 'in_progress', 'leased', 'skipped'}:
                          summary.write('Status: ' + status + '\n\n')
                      mode = entry.get('executed_mode')
                      if mode in {'bootstrap', 'daily', 'refresh'}:
                          summary.write('Mode: ' + mode + '\n\n')
                      for section in (entry, entry.get('database_statistics', {}), entry.get('catalogue_statistics', {}), source_audit):
                          if not isinstance(section, dict):
                              continue
                          for key in ('pages_read', 'requests', 'parsed_listings', 'exported_listings', 'seen_listings', 'new_catalog_listings', 'catalog_rows_upserted', 'new_listings', 'existing_listings', 'observations_inserted'):
                              value = section.get(key)
                              if type(value) is int and value >= 0:
                                  summary.write('- ' + key + ': ' + str(value) + '\n')
                      summary.write('\n')
                      checkpoint = entry.get('checkpoint', source_audit.get('checkpoint', {}))
                      if isinstance(checkpoint, dict):
                          page = checkpoint.get('page', checkpoint.get('next_page'))
                          if type(page) is int and page >= 1:
                              summary.write('Next traversal page: ' + str(page) + '\n\n')
                      completed = entry.get('completed', source_audit.get('completed'))
                      if type(completed) is bool:
                          summary.write('Advertised traversal completed: ' + str(completed).lower() + '\n\n')
                      phases = entry.get('phases', [])
                      if isinstance(phases, list):
                          for phase in phases:
                              if not isinstance(phase, dict) or phase.get('phase') not in {'bootstrap', 'daily', 'refresh'}:
                                  continue
                              audit = phase.get('audit', {})
                              if not isinstance(audit, dict):
                                  continue
                              summary.write('Phase: ' + phase['phase'] + '\n\n')
                              for key in ('pages_read', 'requests', 'exported_listings'):
                                  value = audit.get(key)
                                  if type(value) is int and value >= 0:
                                      summary.write('- ' + key + ': ' + str(value) + '\n')
                              checkpoint = audit.get('checkpoint', {})
                              if isinstance(checkpoint, dict):
                                  page = checkpoint.get('page', checkpoint.get('next_page'))
                                  if type(page) is int and page >= 1:
                                      summary.write('- Next traversal page: ' + str(page) + '\n')
                              summary.write('\n')
                  summary.write('Download the catalogue CSV and full audit to inspect source coverage, checkpoints and stop reasons.\n')
          PY
      - name: Upload catalogue and audit
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: warsaw-catalogue-${{ github.run_id }}
          path: |
            data/catalog.csv
            data/catalog_audit.json
          if-no-files-found: ignore
          retention-days: 14
