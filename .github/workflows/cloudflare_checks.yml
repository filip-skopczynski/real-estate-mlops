name: Cloudflare website checks

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/cloudflare_checks.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/cloudflare_checks.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/cloudflare
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/cloudflare/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/worker.test.mjs
      - run: node build.mjs
      - run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
