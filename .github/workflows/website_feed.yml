name: Warsaw offers website feed

on:
  workflow_run:
    workflows: ['Warsaw OLX and Otodom catalogue']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  publish:
    if: >-
      vars.WEBSITE_ENABLED == 'true' &&
      vars.WEBSITE_URL != '' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.default_branch == 'main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: warsaw-offers-website-feed
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Score latest catalogue and publish curated website feed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WEBSITE_URL: ${{ vars.WEBSITE_URL }}
          WEBSITE_INGEST_TOKEN: ${{ secrets.WEBSITE_INGEST_TOKEN }}
          WEBSITE_SERVICE_TOKEN: ${{ secrets.WEBSITE_SERVICE_TOKEN }}
          WEBSITE_PROVIDER: ${{ vars.WEBSITE_PROVIDER || 'sites' }}
        run: >-
          python -m src.website_feed
          --download-model
          --provider "$WEBSITE_PROVIDER"
          --publish-url "$WEBSITE_URL"
          --output data/website/deals.json
      - name: Upload curated website feed
        uses: actions/upload-artifact@v7.0.1
        with:
          name: warsaw-website-feed-${{ github.run_id }}
          path: data/website/deals.json
          if-no-files-found: error
          retention-days: 7
